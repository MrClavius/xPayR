services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - ./env/postgres/conf/init_keycloak.sh:/docker-entrypoint-initdb.d/init_keycloak.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 15s
      timeout: 10s
      retries: 3

  keycloak:
    build: ./env/keycloak
    container_name: keycloak
    environment:
      KC_HOSTNAME_PORT: 8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_DB_SCHEMA: keycloak_schema
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'" ]
      interval: 30s
      timeout: 5s
      retries: 3

  risk-evaluator-app:
    build:
      context: .
      dockerfile: Dockerfile.jvm
    container_name: risk-evaluator-app
    image: risk-evaluator-app:latest
    ports:
      - "8081:8080"
      - "5005:5005"
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/postgres

      KEYCLOAK_AUTH_URL: http://keycloak:8080/realms/risk-evaluator
      KEYCLOAK_TOKEN_ISSUER: http://localhost:8080/realms/risk-evaluator
      KEYCLOAK_CLIENT_ID: risk-evaluator-backend

      MC_CONSUMER_KEY: 'faiLh-4ecww6lOk9w_yIkZKCzvayudI6yp7s8L6Z887b8bc8!d319b92ac064452dbbf589f309d619240000000000000000'
      MC_PRIVATE_KEY_PATH: /riskevaluator-sandbox.p12
      MC_PRIVATE_KEY_ALIAS: riskevaluator
      MC_PRIVATE_KEY_PASSWORD: 'Eus$$NSjj94vvJpQmDJmc79ccAxmg@M1'

volumes:
  postgresql-data: